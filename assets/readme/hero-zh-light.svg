<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">AI Accounting</title>
  <desc id="d">拍一张小票， 核对两行，就进了账本。 一张便利店小票变成两行草稿：饭团和绿茶 450 日元、本子和圆珠笔 330 日元，各带分类，等你确认入账。</desc>
  <rect width="1200" height="400" rx="28" fill="#F7F6FB"/>
