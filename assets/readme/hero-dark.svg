<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">AI Accounting</title>
  <desc id="d">Snap a receipt. Check two lines. It's in your ledger. A convenience store receipt becomes two draft lines, onigiri and green tea for 450 yen and a notebook and pen for 330 yen, each with a category, waiting to be recorded.</desc>
  <rect width="1200" height="400" rx="28" fill="#161718"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif">
    <text x="64" y="118" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" letter-spacing="2" fill="#7FA2F0">OBSIDIAN PLUGIN · AI DRAFTS, YOU CONFIRM</text>
    <text x="62" y="196" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#EDEDEA">AI Accounting</text>
    <text x="64" y="252" font-size="29" fill="#EDEDEA">Snap a receipt.</text>
    <text x="64" y="292" font-size="29" fill="#9C9A9B">Check two lines. It's in your ledger.</text>
    <text x="64" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#9C9A9B">your own key or a local model · Markdown ledger</text>
  </g>
  <g id="project-proof" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif">
