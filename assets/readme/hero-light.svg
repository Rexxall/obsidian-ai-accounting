    <text x="62" y="196" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#1D1B26">AI Accounting</text>
    <text x="64" y="252" font-size="29" fill="#1D1B26">Snap a receipt.</text>
    <text x="64" y="292" font-size="29" fill="#6B6780">Check two lines. It's in your ledger.</text>
    <text x="64" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" fill="#6B6780">your own key or a local model · Markdown ledger</text>
  </g>
