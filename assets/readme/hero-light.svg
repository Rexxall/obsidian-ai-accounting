<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d">
  <title id="t">AI Accounting</title>
  <desc id="d">Snap a receipt. Check two lines. It's in your ledger. A convenience store receipt becomes two draft lines, onigiri and green tea for 450 yen and a notebook and pen for 330 yen, each with a category, waiting to be recorded.</desc>
  <rect width="1200" height="400" rx="28" fill="#F7F6FB"/>
  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans', sans-serif">
